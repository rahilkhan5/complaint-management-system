# Render Blueprint: runs the API as a free web service.
# On Render: New > Blueprint > pick this repository. It asks for the values marked sync: false.
services:
  - type: web
    name: complaint-desk-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The MongoDB Atlas connection string
      - key: MONGO_URI
        sync: false
      # Where the React app runs, so the browser is allowed to call the API
      - key: CLIENT_URL
        sync: false
      # Render makes a long random secret for signing login tokens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Fresh demo data on every start, and the demo accounts cannot be changed
      - key: DEMO_MODE
        value: "true"
